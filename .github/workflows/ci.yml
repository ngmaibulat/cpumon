name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Both packages ship to Node consumers, so the suite has to run there
            # too - that is what test:node is for.
            - uses: actions/setup-node@v5
              with:
                  node-version: 24

            - run: bun install --frozen-lockfile

            - run: bun run typecheck

            - run: bun run test

            - run: bun run test:node
